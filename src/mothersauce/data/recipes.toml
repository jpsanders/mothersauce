# The catalogue: one entry per recipe. The CLI, the MCP server, the man page and docs/RECIPES.md all read this file.
# A code recipe names its module; a practice recipe names a Markdown file in data/practice/.
# Sections run like a kitchen: prepare, cook the bases, work the line, run the service, check at the pass.

[[recipe]]
id = "workflow"
section = "Mise en place"
title = "The local and CI workflow"
practice = "workflow.md"
summary = "pyenv and pyenv-virtualenv, make targets, and CI that runs exactly what your machine runs."
tags = ["pyenv", "virtualenv", "make", "ci", "github actions", "releases", "setuptools_scm", "template"]
python = ["pyenv install 3.15.2", "pyenv virtualenv", "make checks", "reusable workflows", "tags without v"]
use_when = ["Starting any Python repository", "CI and local results disagree", "Cutting a release"]
avoid_when = ["A single throwaway script, where a virtual environment is enough"]
related = ["layout", "style", "testing"]

[[recipe]]
id = "layout"
section = "Mise en place"
title = "Code layout"
practice = "layout.md"
summary = "The src layout: one package, one concept per module, tests that mirror it, data shipped inside."
tags = ["src layout", "packages", "modules", "py.typed", "entry points", "importlib.resources"]
python = ["src/ layout", "__all__", "py.typed", "__main__.py", "[project.scripts]", "importlib.resources"]
use_when = ["Laying out a new package", "A module has grown past one idea"]
avoid_when = ["Splitting a 200 line module into ten files before it needs it"]
related = ["workflow", "style", "cli"]

[[recipe]]
id = "style"
section = "Mise en place"
title = "Code style"
practice = "style.md"
summary = "Ten checks that end style arguments: black, isort, flake8, darglint, mypy strict, bandit and more."
