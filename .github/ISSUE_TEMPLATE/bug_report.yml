---
name: Bug report
description: A recipe, a command, the MCP server or a check that did not do what the docs say
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran or the tool your agent called, what it did, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The output, a traceback or the CI log. Remove anything private.
      render: text
  - type: input
    id: version
    attributes:
      label: mothersauce, Python and operating system
      placeholder: mothersauce 1.0.0, Python 3.15.2 on Ubuntu 26.04
    validations:
      required: true
