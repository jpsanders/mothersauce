---
name: Recipe or feature request
description: A pattern production Python needs that the menu lacks, or a better way to serve it
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you keep writing by hand, or what your agent keeps getting wrong.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The recipe or the change
      description: The pattern, where it fits on the menu, and a short example if you have one.
    validations:
      required: true
