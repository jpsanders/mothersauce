---
name: ci

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'
  # Run CI manually
  workflow_dispatch:

jobs:
  lint:
    uses: "./.github/workflows/python-checks.yml"
    with:
      python-version: "3.15"
    secrets:
      # This will allow installing pip packages from a package repository.
      package-repo: ${{ secrets.PKG_REPOSITORY }}

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        python-version: ["3.15"]
    uses: "./.github/workflows/python-tests.yml"
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
    secrets:
      package-repo: ${{ secrets.PKG_REPOSITORY }}

  # Proves the built wheel installs on its own and works, with no source tree around it, and that it starts fast.
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: "Build the wheel and the sdist"
        run: |
          python -m pip install build
          python -m build -o dist

      - name: "Install the wheel in a clean environment and use every surface"
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/mothersauce --version
          test "$(/tmp/clean/bin/mothersauce list --ids | wc -l)" -eq 26
          /tmp/clean/bin/mothersauce run pipeline
          /tmp/clean/bin/mothersauce search retry a flaky api call --json
          /tmp/clean/bin/mothersauce guide | head -3
          /tmp/clean/bin/mothersauce show bdd > /dev/null
          /tmp/clean/bin/mothersauce style | head -1
          /tmp/clean/bin/mothersauce skill | head -1
          mkdir -p /tmp/home/.cursor && HOME=/tmp/home /tmp/clean/bin/mothersauce integrate --dry-run
          /tmp/clean/bin/mothersauce man --raw | head -1
          /tmp/clean/bin/mothersauce doctor
          printf '{"jsonrpc": "2.0", "id": 1, "method": "tools/list"}\n' > /tmp/ask.jsonl
          /tmp/clean/bin/mothersauce mcp < /tmp/ask.jsonl | grep -q search_recipes

      - name: "Start up time, and no heavy import on the fast path"
        run: /tmp/clean/bin/python scripts/bench_startup.py
