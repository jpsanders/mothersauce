---
name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout the tag"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: "Check the README badge, the plugin and the MCP config all name this version"
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          grep -q "badge/release-${TAG}-" README.md
          grep -q "\"version\": \"${TAG}\"" .claude-plugin/plugin.json
          grep -q "\"version\": \"${TAG}\"" .claude-plugin/marketplace.json
          grep -q "mothersauce@${TAG}\"" .mcp.json
          grep -q "releases/download/${TAG}/mothersauce-${TAG}-py3-none-any.whl" README.md
          grep -q "^## ${TAG} " CHANGELOG.md

      - name: "Build the wheel and the sdist"
        run: |
          python -m pip install build
          python -m build -o dist
          test -f "dist/mothersauce-${{ github.event.release.tag_name }}-py3-none-any.whl"

      - name: "Attach them to the release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
